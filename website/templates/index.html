<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Price Predictor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('/static/laptops.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            margin: 0;
        }
    </style>
</head>
<body class="p-4 w-full">

    <div class="w-full max-w-4xl mx-auto bg-white rounded-xl shadow-xl overflow-hidden">
        
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-3 md:p-4 text-center">
            <h1 class="text-lg md:text-xl font-bold text-white tracking-wide">Laptop Price Predictor</h1>
        </div>

        <form action="/" method="POST" class="p-4 md:p-5">
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">RAM (GB)</label>
                    <input type="number" name="ram" required min="1" class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none transition-all" placeholder="e.g. 8">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Weight (Kg)</label>
                    <input type="number" step="0.01" name="weight" required min="0.1" class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none transition-all" placeholder="e.g. 1.8">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Brand</label>
                    <select name="company" required class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none transition-all bg-white">
                        <option value="" disabled selected hidden>Select Brand</option>
                        <option value="acer">Acer</option>
                        <option value="apple">Apple</option>
                        <option value="asus">Asus</option>
                        <option value="dell">Dell</option>
                        <option value="hp">HP</option>
                        <option value="lenovo">Lenovo</option>
                        <option value="msi">MSI</option>
                        <option value="toshiba">Toshiba</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Laptop Type</label>
                    <select name="typename" required class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none transition-all bg-white">
                        <option value="" disabled selected hidden>Select Type</option>
                        <option value="2in1convertible">2 in 1 Convertible</option>
                        <option value="gaming">Gaming</option>
                        <option value="netbook">Netbook</option>
                        <option value="notebook">Notebook</option>
                        <option value="ultrabook">Ultrabook</option>
                        <option value="workstation">Workstation</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Operating System</label>
                    <select name="opsys" required class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none transition-all bg-white">
                        <option value="" disabled selected hidden>Select OS</option>
                        <option value="windows">Windows</option>
                        <option value="mac">Mac</option>
                        <option value="linux">Linux</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Processor</label>
                    <select name="cpuname" required class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none transition-all bg-white">
                        <option value="" disabled selected hidden>Select CPU</option>
                        <option value="intelcorei3">Intel Core i3</option>
                        <option value="intelcorei5">Intel Core i5</option>
                        <option value="intelcorei7">Intel Core i7</option>
                        <option value="amd">AMD</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Graphics Card</label>
                    <select name="gpuname" required class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-blue-500 outline-none transition-all bg-white">
                        <option value="" disabled selected hidden>Select GPU</option>
                        <option value="intel">Intel</option>
                        <option value="amd">AMD</option>
                        <option value="nvidia">Nvidia</option>
                    </select>
                </div>
                
                <div class="md:col-span-2 flex items-center justify-center gap-8 py-1 bg-gray-50 rounded border border-gray-200">
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" name="touchscreen" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-1 focus:ring-blue-500 transition-colors">
                        <span class="text-xs md:text-sm text-gray-700 font-medium group-hover:text-blue-600 transition-colors">Touch Screen</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <input type="checkbox" name="ips" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-1 focus:ring-blue-500 transition-colors">
                        <span class="text-xs md:text-sm text-gray-700 font-medium group-hover:text-blue-600 transition-colors">IPS Panel</span>
                    </label>
                </div>
            </div>

            <div class="mt-5">
                <button type="submit" class="w-full py-2.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white font-bold rounded shadow hover:shadow-md transition-all text-sm">
                    Predict Price
                </button>
            </div>
        </form>

        {% if pred_value and pred_value != 0 %}
        <div class="bg-blue-50 border-t border-blue-100 p-4 text-center">
            <div class="inline-block px-6 py-2 bg-white rounded-full shadow-sm border border-blue-100">
                <span class="text-gray-500 font-semibold mr-2 uppercase tracking-wide text-xs">Estimated Price</span>
                <span class="text-lg md:text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-indigo-700">LKR {{ "{:,.2f}".format(pred_value) }}</span>
            </div>
        </div>
        {% endif %}

    </div>
</body>
</html>
